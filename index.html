<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e9ecf1">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>[hidden]{display:none!important}img{max-width:100%}:root{color-scheme:light}body{margin:0}</style>
<title>Caderno Pencil</title>
<style>
/* Layout: sidebar de pastas, lista de notas e folha de desenho; barra de ferramentas flutuante embaixo, como no iPadOS. */
:root {
  --bg: #e9ecf1;
  --panel: #f6f7f9;
  --panel-2: #eef0f4;
  --ink: #14171c;
  --muted: #667085;
  --line: #d9dde5;
  --accent: #2f5bea;
  --accent-soft: #e3e9fd;
  --danger: #d92d20;
  --paper: #fbfbfd; /* a folha fica clara nos dois temas, como no Samsung Notes */
  --paper-line: #c9d3e6;
  --paper-ink: #14171c;
  --bar: rgba(255,255,255,.82);
  --shadow: 0 10px 30px rgba(20,23,28,.16), 0 1px 3px rgba(20,23,28,.12);
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-title: ui-serif, "New York", Georgia, serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0e12; --panel: #15181e; --panel-2: #1c2028; --ink: #eceef2; --muted: #98a2b3;
    --line: #272c36; --accent: #7c9bff; --accent-soft: #232c4d; --danger: #f97066;
    --bar: rgba(28,32,40,.82); --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0e12; --panel: #15181e; --panel-2: #1c2028; --ink: #eceef2; --muted: #98a2b3;
  --line: #272c36; --accent: #7c9bff; --accent-soft: #232c4d; --danger: #f97066;
  --bar: rgba(28,32,40,.82); --shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15px;
  padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px));
  overflow: hidden; -webkit-user-select: none; user-select: none; overscroll-behavior: none;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

#app { display: grid; grid-template-columns: 232px 320px minmax(0, 1fr); height: 100%; min-width: 0; }

/* Sidebar */
#side { background: var(--panel-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.brand { padding: 6px 18px 14px; font-family: var(--font-title); font-weight: 600; font-size: 24px; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
.brand i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; color: #fff; }
.brand i .ico { width: 15px; height: 15px; stroke: #fff; }
.folders { flex: 1; overflow-y: auto; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }
.folder { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; text-align: left; width: 100%; min-height: 44px; }
.folder .ico { width: 20px; height: 20px; color: var(--accent); flex: none; }
.folder span.n { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folder span.c { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.folder.on { background: var(--accent-soft); font-weight: 600; }
.folder-h { padding: 16px 12px 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.side-foot { padding: 10px; border-top: 1px solid var(--line); display: flex; gap: 6px; padding-bottom: max(10px, env(safe-area-inset-bottom, 0px)); }
.side-foot button { flex: 1; min-height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--accent); font-weight: 600; }
.side-foot button:active, .folder:active { background: var(--accent-soft); }

/* Lista */
#list { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.list-top { padding: 14px 14px 8px; display: flex; flex-direction: column; gap: 10px; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
.list-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.list-title h2 { margin: 0; font-family: var(--font-title); font-size: 28px; font-weight: 600; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.round { width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; background: var(--accent); color: #fff; flex: none; }
.round .ico { stroke: #fff; }
.search { display: flex; align-items: center; gap: 8px; background: var(--panel-2); border-radius: 12px; padding: 0 12px; min-height: 40px; color: var(--muted); }
.search .ico { width: 18px; height: 18px; }
.search input { flex: 1; min-width: 0; background: none; border: 0; color: var(--ink); font: inherit; outline: none; user-select: text; -webkit-user-select: text; }
.cards { flex: 1; overflow-y: auto; padding: 4px 10px 20px; display: flex; flex-direction: column; gap: 8px; -webkit-overflow-scrolling: touch; }
.card { display: flex; gap: 12px; text-align: left; width: 100%; padding: 12px; border-radius: 14px; background: var(--panel-2); border: 1.5px solid transparent; min-width: 0; }
.card.on { border-color: var(--accent); background: var(--accent-soft); }
.thumb { width: 64px; height: 84px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); flex: none; overflow: hidden; position: relative; }
.thumb svg { width: 100%; height: 100%; }
.card .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .s { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .d { color: var(--muted); font-size: 12px; margin-top: auto; display: flex; gap: 8px; align-items: center; }
.empty { margin: 40px 20px; text-align: center; color: var(--muted); line-height: 1.5; }

/* Editor */
#editor { display: flex; flex-direction: column; min-width: 0; position: relative; background: var(--bg); }
.ed-top { display: flex; align-items: center; gap: 8px; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
.ed-top input.title { flex: 1; min-width: 0; background: none; border: 0; outline: none; font-family: var(--font-title); font-size: 24px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; user-select: text; -webkit-user-select: text; }
.ibtn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); flex: none; }
.ibtn:active { background: var(--accent-soft); }
.ibtn.on { color: var(--accent); background: var(--accent-soft); }
.ibtn[disabled] { opacity: .35; pointer-events: none; }
.back { display: none; }
.saved { font-size: 12px; color: var(--muted); white-space: nowrap; }
#scroller { flex: 1; overflow: auto; padding: 18px 18px 140px; -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom; }
#sheet { position: relative; margin: 0 auto; max-width: 900px; width: 100%; background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); touch-action: pan-y; }
#sheet.pen-only { touch-action: pan-y; }
#sheet.drawing-touch { touch-action: none; }
#paper, #ink { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#texts { position: absolute; inset: 0; pointer-events: none; }
#texts.edit .tbox { pointer-events: auto; }
#live { position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none; }
#sheet { touch-action: none; }
.tbox { position: absolute; min-width: 80px; pointer-events: none; border: 1.5px dashed transparent; border-radius: 8px; padding: 4px 6px 4px 6px; }
.tbox.sel { border-color: var(--accent); background: rgba(47,91,234,.05); }
.tbox .tx { outline: none; min-height: 1.2em; white-space: pre-wrap; word-break: break-word; font-family: var(--font-ui); line-height: 1.35; user-select: text; -webkit-user-select: text; color: var(--paper-ink); }
.tbox .grip { position: absolute; left: -14px; top: -14px; width: 28px; height: 28px; border-radius: 14px; background: var(--accent); display: none; place-items: center; touch-action: none; }
.tbox .grip .ico { width: 14px; height: 14px; stroke: #fff; }
.tbox .del { position: absolute; right: -14px; top: -14px; width: 28px; height: 28px; border-radius: 14px; background: var(--danger); display: none; place-items: center; }
.tbox .del .ico { width: 14px; height: 14px; stroke: #fff; }
.tbox.sel .grip, .tbox.sel .del { display: grid; }
.addpage { display: block; margin: 16px auto 0; padding: 10px 18px; border-radius: 22px; background: var(--panel); color: var(--accent); font-weight: 600; border: 1px solid var(--line); min-height: 44px; }

/* Barra flutuante */
.dock { position: absolute; left: 0; right: 0; margin: 0 auto; width: fit-content; bottom: max(18px, env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 2px; padding: 6px; background: var(--bar); -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6); border-radius: 28px; box-shadow: var(--shadow); border: 1px solid var(--line); max-width: calc(100% - 24px); overflow-x: auto; z-index: 5; }
.tool { width: 52px; height: 48px; border-radius: 22px; display: grid; place-items: center; color: var(--ink); flex: none; position: relative; }
.tool.on { background: var(--accent); color: #fff; }
.tool.on .ico { stroke: #fff; }
.tool .dot { position: absolute; bottom: 5px; width: 14px; height: 4px; border-radius: 2px; }
.sep { width: 1px; height: 26px; background: var(--line); margin: 0 4px; flex: none; }
.swatch { width: 34px; height: 34px; border-radius: 17px; border: 3px solid var(--bar); box-shadow: 0 0 0 1.5px var(--line); flex: none; margin: 0 3px; }
.swatch.on { box-shadow: 0 0 0 2.5px var(--accent); }

.pop { position: absolute; bottom: calc(max(18px, env(safe-area-inset-bottom, 0px)) + 66px); left: 50%; transform: translateX(-50%); background: var(--bar); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; width: min(340px, calc(100% - 24px)); z-index: 6; display: flex; flex-direction: column; gap: 12px; }
.pop h4 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pop .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pop input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 32px; }
.prev { height: 36px; display: grid; place-items: center; background: var(--paper); border-radius: 10px; border: 1px solid var(--line); }
.chip { padding: 8px 14px; min-height: 40px; border-radius: 20px; background: var(--panel-2); font-weight: 500; }
.chip.on { background: var(--accent); color: #fff; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; width: 100%; text-align: left; }
.switch b { width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.switch b::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 11px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s; }
.switch.on b { background: var(--accent); }
.switch.on b::after { transform: translateX(18px); }

.toast { position: absolute; top: calc(max(10px, env(safe-area-inset-top, 0px)) + 62px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 20px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }
.sheetmenu { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); display: flex; align-items: flex-end; justify-content: center; }
.sheetmenu .box { background: var(--panel); width: min(420px, 100%); border-radius: 20px 20px 0 0; padding: 16px 16px max(16px, env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow); }
.sheetmenu h3 { margin: 0 0 4px; font-family: var(--font-title); font-size: 20px; }
.sheetmenu input { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; color: var(--ink); user-select: text; -webkit-user-select: text; min-height: 44px; }
.sheetmenu .opt { padding: 12px; border-radius: 12px; text-align: left; min-height: 48px; display: flex; align-items: center; gap: 10px; }
.sheetmenu .opt:active { background: var(--accent-soft); }
.sheetmenu .opt.danger { color: var(--danger); }
.sheetmenu .btns { display: flex; gap: 8px; justify-content: flex-end; }
.sheetmenu .btns button { padding: 10px 18px; border-radius: 12px; min-height: 44px; font-weight: 600; }
.sheetmenu .btns .ok { background: var(--accent); color: #fff; }

.noedit { flex: 1; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; line-height: 1.6; }
.noedit b { display: block; font-family: var(--font-title); font-size: 26px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }

/* Dock responsivo: quando a área da nota é estreita (iPad na horizontal com painéis abertos), as cores saem da barra e ficam num botão */
#editor { container-type: inline-size; }
.curcol { display: none; }
.curcol i { display: block; width: 26px; height: 26px; border-radius: 13px; border: 3px solid var(--bar); box-shadow: 0 0 0 1.5px var(--line); }
@container (max-width: 800px) { #dockColors, #dock .sep.sc { display: none !important; } .curcol { display: grid; } }
#paper, #ink, #live { pointer-events: none; }
#app.focus { grid-template-columns: minmax(0, 1fr); }
#app.focus #side, #app.focus #list { display: none !important; }
#app.focus #btnBackList { display: grid; }
#btnPanels { display: none; }
@media (min-width: 821px) { #app:not(.focus) #btnPanels { display: grid; } }

/* Objetos: tabelas, modelos 3D, imagens */
#objs { position: absolute; inset: 0; pointer-events: none; }
#objs.edit .obj { pointer-events: auto; }
.obj { position: absolute; border: 1.5px dashed transparent; border-radius: 6px; }
.obj.sel { border-color: var(--accent); }
.obj .grip, .obj .del, .obj .rs { position: absolute; width: 30px; height: 30px; border-radius: 15px; display: none; place-items: center; touch-action: none; z-index: 2; }
.obj .grip { left: -15px; top: -15px; background: var(--accent); }
.obj .del { right: -15px; top: -15px; background: var(--danger); }
.obj .rs { right: -15px; bottom: -15px; background: var(--accent); }
.obj .grip svg, .obj .del svg, .obj .rs svg { width: 14px; height: 14px; stroke: #fff; }
.obj.sel .grip, .obj.sel .del, .obj.sel .rs { display: grid; }
.m3d canvas { width: 100%; height: 100%; display: block; border-radius: 6px; background: #eaeef6; touch-action: none; }
.m3d .lbl { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: #667085; pointer-events: none; }
.m3d .busy { position: absolute; inset: 0; display: grid; place-items: center; color: #667085; font-size: 14px; pointer-events: none; }
.oimg img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; border-radius: 4px; }
.otable { border-collapse: collapse; width: 100%; table-layout: fixed; background: rgba(255,255,255,.4); }
.otable td { border: 1.5px solid #7a869a; padding: 6px 8px; vertical-align: top; color: var(--paper-ink); outline: none; word-break: break-word; font-family: var(--font-ui); user-select: text; -webkit-user-select: text; min-height: 1.5em; }
.otable td:focus { background: rgba(47,91,234,.08); }
.tbar { position: absolute; left: 0; top: -54px; display: none; gap: 2px; background: var(--bar); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border: 1px solid var(--line); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); z-index: 3; }
.obj.sel .tbar { display: flex; }
.tbar button { min-height: 42px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink); }
.tbar button:active, .tbar button.on { background: var(--accent-soft); color: var(--accent); }
.insgrid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.insbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px 6px; border-radius: 14px; background: var(--panel-2); font-weight: 600; font-size: 13px; min-height: 72px; }
.insbtn:active { background: var(--accent-soft); }
.insbtn .ico { color: var(--accent); }

/* Telas estreitas: uma coluna por vez */
@media (max-width: 1000px) { #app { grid-template-columns: 200px 280px minmax(0, 1fr); } }
@media (max-width: 820px) {
  #app { display: block; position: relative; }
  #side, #list, #editor { position: absolute; inset: 0; width: 100%; }
  #app[data-view="folders"] #list, #app[data-view="folders"] #editor { display: none; }
  #app[data-view="list"] #side, #app[data-view="list"] #editor { display: none; }
  #app[data-view="editor"] #side, #app[data-view="editor"] #list { display: none; }
  .back { display: grid; }
}
@media (min-width: 821px) { #app[data-view] #side, #app[data-view] #list, #app[data-view] #editor { display: flex; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app" data-view="list">
  <aside id="side" aria-label="Pastas">
    <div class="brand"><i><svg class="ico" data-ico="pen"></svg></i>Caderno</div>
    <nav class="folders" id="folders"></nav>
    <div class="side-foot">
      <button id="btnNewFolder" type="button"><svg class="ico" data-ico="folderplus"></svg>Nova pasta</button>
      <button id="btnTheme" type="button" aria-label="Alternar tema" style="flex:0 0 52px"><svg class="ico" data-ico="moon"></svg></button>
    </div>
  </aside>

  <section id="list" aria-label="Notas">
    <div class="list-top">
      <div class="list-title">
        <button class="ibtn back" id="btnBackFolders" type="button" aria-label="Pastas"><svg class="ico" data-ico="chevl"></svg></button>
        <h2 id="listTitle">Todas as notas</h2>
        <button class="round" id="btnNew" type="button" aria-label="Nova nota"><svg class="ico" data-ico="plus"></svg></button>
      </div>
      <label class="search"><svg class="ico" data-ico="search"></svg><input id="q" type="search" placeholder="Buscar notas" autocomplete="off"></label>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <main id="editor" aria-label="Editor">
    <div class="noedit" id="noedit"><div><b>Nenhuma nota aberta</b>Toque em + para criar uma nota<br>e escreva com a Apple Pencil.</div></div>

    <div id="edwrap" style="display:none;flex:1;min-height:0;flex-direction:column">
      <div class="ed-top">
        <button class="ibtn back" id="btnBackList" type="button" aria-label="Voltar"><svg class="ico" data-ico="chevl"></svg></button>
        <button class="ibtn" id="btnPanels" type="button" aria-label="Tela cheia da nota"><svg class="ico" data-ico="panel"></svg></button>
        <input class="title" id="title" type="text" placeholder="Título" aria-label="Título da nota" autocomplete="off">
        <span class="saved" id="saved"></span>
        <button class="ibtn" id="btnUndo" type="button" aria-label="Desfazer"><svg class="ico" data-ico="undo"></svg></button>
        <button class="ibtn" id="btnRedo" type="button" aria-label="Refazer"><svg class="ico" data-ico="redo"></svg></button>
        <button class="ibtn" id="btnFav" type="button" aria-label="Favoritar"><svg class="ico" data-ico="star"></svg></button>
        <button class="ibtn" id="btnMore" type="button" aria-label="Mais opções"><svg class="ico" data-ico="more"></svg></button>
      </div>

      <div id="scroller">
        <div id="sheet">
          <canvas id="paper"></canvas>
          <div id="objs"></div>
          <canvas id="ink"></canvas>
          <div id="texts"></div>
        </div>
        <button class="addpage" id="btnAddPage" type="button">+ Adicionar página</button>
      </div>

      <div class="pop" id="popPen" hidden>
        <h4 id="popTitle">Caneta</h4>
        <div class="prev"><svg id="prevSvg" width="200" height="30" viewBox="0 0 200 30"><path id="prevPath" d="M8 20 C 50 2, 90 30, 120 14 S 170 10, 192 16" fill="none" stroke-linecap="round"/></svg></div>
        <div class="row"><svg class="ico" data-ico="dot" style="width:10px;height:10px"></svg><input id="rngW" type="range" min="1" max="24" step="1" aria-label="Espessura"><svg class="ico" data-ico="dot" style="width:22px;height:22px"></svg></div>
        <h4>Cor</h4>
        <div class="row" id="popColors"></div>
      </div>

      <div class="pop" id="popPaper" hidden>
        <h4>Papel</h4>
        <div class="row" id="paperChips"></div>

function count(fn) { return S.notes.filter(fn).length; }
function renderFolders() {
  var items = [
    { id: 'all', name: 'Todas as notas', ic: 'all', c: count(function (n) { return !n.trash; }) },
    { id: 'fav', name: 'Favoritas', ic: 'star', c: count(function (n) { return n.fav && !n.trash; }) }
  ];
  var html = items.map(folderBtn).join('') + '<div class="folder-h">Pastas</div>';
  html += S.folders.map(function (f) { return folderBtn({ id: f.id, name: f.name, ic: 'folder', c: count(function (n) { return n.folder === f.id && !n.trash; }), custom: true }); }).join('');
  html += '<div class="folder-h">&nbsp;</div>' + folderBtn({ id: 'trash', name: 'Lixeira', ic: 'trash', c: count(function (n) { return n.trash; }) });
  var host = $('#folders'); host.innerHTML = html;
  $$('.folder', host).forEach(function (b) {
    var id = b.getAttribute('data-id'), timer = null, long = false;
    b.addEventListener('click', function () { if (long) { long = false; return; } S.folder = id; S.q = ''; $('#q').value = ''; renderAll(); if (isNarrow()) setView('list'); });
    if (b.getAttribute('data-custom')) {
      b.addEventListener('pointerdown', function () { long = false; timer = setTimeout(function () { long = true; folderMenu(id); }, 550); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(timer); }); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    }
  });
  CP.paintIcons(host);
}
function $$(s, r) { return CP.$$(s, r); }
function folderBtn(f) {
  return '<button type="button" class="folder' + (S.folder === f.id ? ' on' : '') + '" data-id="' + esc(f.id) + '"' + (f.custom ? ' data-custom="1"' : '') + '>' +
    '<svg class="ico" data-ico="' + f.ic + '"></svg><span class="n">' + esc(f.name) + '</span><span class="c">' + f.c + '</span></button>';
}

/* ---------- Lista ---------- */
function thumb(n) {
  var out = '', lim = 0;
  n.strokes.forEach(function (s) {
    if (lim++ > 120) return;
    var d = s.d, len = d.length / 3, step = Math.max(1, Math.ceil(len / 50)), p = '';
    for (var i = 0; i < len; i += step) p += (i ? 'L' : 'M') + d[i * 3] + ' ' + d[i * 3 + 1];
    if (len > 1) p += 'L' + d[(len - 1) * 3] + ' ' + d[(len - 1) * 3 + 1];
    if (!p) return;
    out += '<path d="' + p + '" fill="none" stroke="' + esc(s.c) + '" stroke-width="' + Math.max(s.w * 2.2, 7) + '" stroke-linecap="round" stroke-linejoin="round"' + (s.k === 'h' ? ' opacity=".4"' : '') + '/>';
  });
  return '<svg viewBox="0 0 1000 1414" preserveAspectRatio="xMidYMin slice">' + out + '</svg>';
}
function renderList() {
  $('#listTitle').textContent = folderName();
  var notes = visible(), host = $('#cards');
  if (!notes.length) {
    host.innerHTML = '<div class="empty">' + (S.q ? 'Nada encontrado para essa busca.' : S.folder === 'trash' ? 'A lixeira está vazia.' : 'Nenhuma nota aqui ainda.<br>Toque em + para começar.') + '</div>';
    return;
  }
  host.innerHTML = notes.map(function (n) {
    var snip = plain(n) || (n.strokes.length ? 'Nota manuscrita' : 'Nota vazia');
    return '<button type="button" class="card' + (n.id === S.openId ? ' on' : '') + '" data-id="' + n.id + '">' +
      '<div class="thumb">' + thumb(n) + '</div><div class="meta"><div class="t">' + esc(n.title || 'Sem título') + '</div>' +
      '<div class="s">' + esc(snip) + '</div><div class="d">' + CP.fmtDate(n.updated) + (n.fav ? ' ' + CP.svgIcon('star', ' style="width:13px;height:13px;fill:currentColor"') : '') + '</div></div></button>';
  }).join('');
  $$('.card', host).forEach(function (c) { c.addEventListener('click', function () { UI.open(c.getAttribute('data-id')); }); });
}
function renderAll() { renderFolders(); renderList(); }

/* ---------- Menus em folha ---------- */
function sheetMenu(html, wire) {
  var host = $('#menuHost');
  host.innerHTML = '<div class="sheetmenu"><div class="box">' + html + '</div></div>';
  CP.paintIcons(host);
  var bg = host.firstChild;
  function close() { host.innerHTML = ''; }
  bg.addEventListener('pointerdown', function (e) { if (e.target === bg) close(); });
  wire(host, close);
}
function folderMenu(id) {
  var f = S.folders.filter(function (x) { return x.id === id; })[0]; if (!f) return;
  sheetMenu('<h3>' + esc(f.name) + '</h3><input id="fName" type="text" value="' + esc(f.name) + '" aria-label="Nome da pasta">' +
    '<div class="btns"><button type="button" id="fDel" style="color:var(--danger)">Excluir pasta</button><button type="button" class="ok" id="fOk">Renomear</button></div>',
    function (h, close) {
      $('#fOk', h).addEventListener('click', function () { var v = $('#fName', h).value.trim(); if (v) { f.name = v; CP.persistMeta(); renderAll(); } close(); });
      $('#fDel', h).addEventListener('click', function () {
        S.notes.forEach(function (n) { if (n.folder === id) { n.folder = 'pessoal'; CP.queueSave(n); } });
        S.folders = S.folders.filter(function (x) { return x.id !== id; });
        if (!S.folders.some(function (x) { return x.id === 'pessoal'; })) S.folders.unshift({ id: 'pessoal', name: 'Pessoal' });
        if (S.folder === id) S.folder = 'all';
        CP.persistMeta(); renderAll(); close();
      });
    });
}
function newFolderMenu() {
  sheetMenu('<h3>Nova pasta</h3><input id="fName" type="text" placeholder="Nome da pasta" aria-label="Nome da pasta" autocomplete="off"><div class="btns"><button type="button" id="fNo">Cancelar</button><button type="button" class="ok" id="fOk">Criar</button></div>',
    function (h, close) {
      $('#fNo', h).addEventListener('click', close);
      function ok() { var v = $('#fName', h).value.trim(); if (v) { var id = 'f' + CP.uid(); S.folders.push({ id: id, name: v }); S.folder = id; CP.persistMeta(); renderAll(); } close(); }
      $('#fOk', h).addEventListener('click', ok);
      $('#fName', h).addEventListener('keydown', function (e) { if (e.key === 'Enter') ok(); });
      setTimeout(function () { $('#fName', h).focus(); }, 50);
    });
}
function noteMenu() {
  var n = CP.cur(); if (!n) return;
  var html = '<h3>' + esc(n.title || 'Sem título') + '</h3>';
  if (n.trash) html += '<button type="button" class="opt" id="mRestore">' + CP.svgIcon('restore') + 'Restaurar</button><button type="button" class="opt danger" id="mKill">' + CP.svgIcon('trash') + 'Excluir para sempre</button>';
  else {
    html += '<div class="folder-h" style="padding:6px 4px">Mover para</div>' + S.folders.map(function (f) {
      return '<button type="button" class="opt" data-f="' + esc(f.id) + '">' + CP.svgIcon('folder') + esc(f.name) + (n.folder === f.id ? ' ✓' : '') + '</button>';
    }).join('');
    html += '<button type="button" class="opt" id="mDup">' + CP.svgIcon('copy') + 'Duplicar nota</button><button type="button" class="opt danger" id="mTrash">' + CP.svgIcon('trash') + 'Mover para a lixeira</button>';
  }
  sheetMenu(html, function (h, close) {
    $$('[data-f]', h).forEach(function (b) { b.addEventListener('click', function () { n.folder = b.getAttribute('data-f'); CP.queueSave(n); renderAll(); close(); }); });
    var on = function (id, fn) { var e = $('#' + id, h); if (e) e.addEventListener('click', function () { fn(); close(); }); };
    on('mTrash', function () { n.trash = true; CP.queueSave(n); UI.close(); renderAll(); CP.toast('Nota na lixeira'); });
    on('mRestore', function () { n.trash = false; CP.queueSave(n); UI.close(); renderAll(); });
    on('mKill', function () { CP.deleteForever(n); UI.close(); renderAll(); });
    on('mDup', function () {
      var c = JSON.parse(JSON.stringify(n)); c.id = CP.uid(); c.title = (n.title || 'Sem título') + ' (cópia)'; c.created = c.updated = Date.now();
      S.notes.push(c); CP.queueSave(c); renderAll(); UI.open(c.id);
    });
  });
}

UI.sheetMenu = sheetMenu; UI.renderAll = renderAll; UI.renderList = renderList; UI.renderFolders = renderFolders;
UI.setView = setView; UI.isNarrow = isNarrow; UI.newFolderMenu = newFolderMenu; UI.noteMenu = noteMenu; UI.visible = visible;
})();
(function () {
'use strict';
var CP = window.CP, $ = CP.$, S = CP.S, E = CP.engine, UI = CP.ui;
var listT;

/* ---------- Abrir e fechar nota ---------- */
function showEditor(on) { $('#noedit').style.display = on ? 'none' : 'grid'; $('#edwrap').style.display = on ? 'flex' : 'none'; }
UI.open = function (id) {
  var cur = CP.cur(); if (cur) CP.flushSave(cur);
  var n = CP.byId(id); if (!n) return;
  S.openId = id; showEditor(true);
  $('#title').value = n.title || '';
  E.resetHistory(); E.setTextMode(S.tool === 'text' || S.tool === 'select'); if (E.setSelectMode) E.setSelectMode(S.tool === 'select');
  if (!UI.isNarrow() && window.innerWidth < 1280) setFocus(true);
  syncTop(); UI.renderList();
  if (UI.isNarrow()) UI.setView('editor');
  requestAnimationFrame(function () { E.layout(); $('#scroller').scrollTop = 0; });
  CP.setSavedLabel('');
};
UI.close = function () {
  var cur = CP.cur(); if (cur) CP.flushSave(cur);
  S.openId = null; showEditor(false); setFocus(false);
  if (UI.isNarrow()) UI.setView('list');
  UI.renderList();
};
function syncTop() {
  var n = CP.cur(); if (!n) return;
  $('#btnFav').classList.toggle('on', !!n.fav);
  $('#btnFav svg').style.fill = n.fav ? 'currentColor' : 'none';
  $('#btnUndo').disabled = !E.canUndo(); $('#btnRedo').disabled = !E.canRedo();
}
CP.hooks.onChange = function () {
  syncTop(); clearTimeout(listT);
  listT = setTimeout(function () { UI.renderList(); UI.renderFolders(); }, 700);
};
CP.hooks.onPenOnly = function () { syncSwitch(); };

/* ---------- Ferramentas ---------- */
var openPop = null;
function cfg() { return S.tool === 'hl' ? S.hl : S.tool === 'eraser' ? S.eraser : S.pen; }
function syncDock() {
  CP.$$('.tool[data-tool]').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-tool') === S.tool); });
  var box = $('#dockColors'); box.innerHTML = '';
  if (S.tool !== 'eraser') {
    var pal = S.tool === 'hl' ? CP.HL_COLORS : CP.COLORS, c = cfg().c;
    pal.forEach(function (col) { box.appendChild(swatch(col, col === c, function () { cfg().c = col; CP.persistMeta(); syncDock(); syncPop(); })); });
  }
  box.style.display = S.tool === 'eraser' ? 'none' : 'flex';
  $$sep();
  var ci = $('#curCol i'); if (ci) ci.style.background = S.tool === 'eraser' ? '#9aa6bd' : cfg().c;
  E.setTextMode(S.tool === 'text' || S.tool === 'select');
  if (E.setSelectMode) E.setSelectMode(S.tool === 'select');
}
function $$sep() { var s = CP.$$('#dock .sep'); if (s[1]) s[1].style.display = S.tool === 'eraser' ? 'none' : ''; }
function swatch(col, on, fn) {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'swatch' + (on ? ' on' : ''); b.style.background = col; b.setAttribute('aria-label', 'Cor ' + col);
  b.addEventListener('click', fn); return b;
}
function syncPop() {
  var t = S.tool, c = cfg(), r = $('#rngW');
  $('#popTitle').textContent = t === 'pen' ? 'Caneta' : t === 'hl' ? 'Marca-texto' : t === 'eraser' ? 'Borracha' : 'Texto — tamanho e cor';
  var lim = t === 'pen' || t === 'text' ? [1, 24] : [6, 40];
  r.min = lim[0]; r.max = lim[1]; r.value = (t === 'text' ? S.pen.w : c.w);
  var path = $('#prevPath');
  path.setAttribute('stroke', t === 'eraser' ? '#9aa6bd' : c.c);
  path.setAttribute('stroke-width', t === 'text' ? 3 : c.w);
  path.setAttribute('opacity', t === 'hl' ? '.45' : '1');
  path.setAttribute('stroke-dasharray', t === 'eraser' ? '2 7' : '');
  var cols = $('#popColors'); cols.innerHTML = '';
  if (t !== 'eraser') {
    var pal = t === 'hl' ? CP.HL_COLORS : CP.COLORS;
    pal.forEach(function (col) { cols.appendChild(swatch(col, col === c.c, function () { c.c = col; CP.persistMeta(); syncDock(); syncPop(); })); });
  }
  cols.previousElementSibling.style.display = t === 'eraser' ? 'none' : '';
}
function togglePop(el, render) {
  var was = openPop === el && !el.hidden;
  closePops();
  if (!was) { if (render) render(); el.hidden = false; openPop = el; }
}
function closePops() { ['#popPen', '#popPaper', '#popInsert'].forEach(function (s) { $(s).hidden = true; }); openPop = null; }
function syncSwitch() { $('#swPenOnly').classList.toggle('on', S.penOnly); $('#swSnap').classList.toggle('on', S.snap); }
function setFocus(on) { S.focus = on; $('#app').classList.toggle('focus', on); setTimeout(E.layout, 40); }

/* ---------- Inserir: tabela, modelo 3D, imagem ---------- */
var insKind = 'table', fileIn = null;
function pickFile(accept, fn) {
  if (!fileIn) { fileIn = document.createElement('input'); fileIn.type = 'file'; fileIn.hidden = true; document.body.appendChild(fileIn); }
  fileIn.accept = accept; fileIn.value = '';
  fileIn.onchange = function () { var f = fileIn.files && fileIn.files[0]; if (f) fn(f); };
  fileIn.click();
}
function inserted() { S.tool = 'select'; closePops(); syncDock(); CP.persistMeta(); }
function chip(txt, fn, cls) {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (cls ? ' ' + cls : ''); b.textContent = txt; b.addEventListener('click', fn); return b;
}
function renderInsert() {
  var host = $('#insOpts'); host.innerHTML = '';
  $('#popInsH').textContent = insKind === 'table' ? 'Tamanho da tabela' : insKind === 'model' ? 'Modelo 3D' : 'Imagem';
  if (insKind === 'table') {
    [[2, 2], [3, 3], [4, 3], [5, 4], [6, 5]].forEach(function (d) { host.appendChild(chip(d[0] + ' × ' + d[1], function () { CP.objs.addTable(d[0], d[1]); inserted(); })); });
  } else if (insKind === 'model') {
    host.appendChild(chip('Abrir arquivo STL, OBJ ou GLB', function () { pickFile('', function (f) { CP.objs.addModelFile(f); inserted(); }); }, 'on'));
    Object.keys(CP.objs.PRIMS).forEach(function (k) { host.appendChild(chip(CP.objs.PRIMS[k], function () { CP.objs.addPrimitive(k); inserted(); })); });
  } else {
    host.appendChild(chip('Escolher foto ou imagem', function () { pickFile('image/*', function (f) { CP.objs.addImage(f); inserted(); }); }, 'on'));
  }
}
function renderInsertPop() { renderInsert(); }
function renderPaperPop() {
  var n = CP.cur(); if (!n) return;
  var host = $('#paperChips'); host.innerHTML = '';
  CP.PAPERS.forEach(function (p) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (n.paper === p[0] ? ' on' : ''); b.textContent = p[1];
    b.addEventListener('click', function () { n.paper = p[0]; CP.queueSave(n); E.drawPaper(); renderPaperPop(); });
    host.appendChild(b);
  });
  syncSwitch();
}

/* ---------- Tema ---------- */
function applyTheme() {
  var root = document.documentElement;
  if (S.theme) root.setAttribute('data-theme', S.theme); else root.removeAttribute('data-theme');
  var dark = S.theme ? S.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  $('#btnTheme').innerHTML = CP.svgIcon(dark ? 'sun' : 'moon');
}

/* ---------- Ligações ---------- */
function wire() {
  $('#btnNew').addEventListener('click', function () {
    var n = CP.newNote(S.folder); S.notes.push(n); CP.queueSave(n);
    if (S.folder === 'trash') S.folder = 'all';
    UI.renderAll(); UI.open(n.id); setTimeout(function () { $('#title').focus(); }, 60);
  });
  $('#btnNewFolder').addEventListener('click', UI.newFolderMenu);
  $('#btnTheme').addEventListener('click', function () {
    var dark = S.theme ? S.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    S.theme = dark ? 'light' : 'dark'; applyTheme(); CP.persistMeta();
  });
  $('#q').addEventListener('input', function (e) { S.q = e.target.value; UI.renderList(); });
  $('#btnBackFolders').addEventListener('click', function () { UI.setView('folders'); });
  $('#btnBackList').addEventListener('click', function () { if (!UI.isNarrow() && S.focus) setFocus(false); else UI.close(); });
  $('#btnPanels').addEventListener('click', function () { setFocus(true); });
  $('#title').addEventListener('input', function (e) { var n = CP.cur(); if (!n) return; n.title = e.target.value; CP.queueSave(n); CP.hooks.onChange(); });
  $('#btnUndo').addEventListener('click', function () { E.undo(); });
  $('#btnRedo').addEventListener('click', function () { E.redo(); });
  $('#btnFav').addEventListener('click', function () { var n = CP.cur(); if (!n) return; n.fav = !n.fav; CP.queueSave(n); syncTop(); UI.renderAll(); });
  $('#btnMore').addEventListener('click', UI.noteMenu);
  $('#btnAddPage').addEventListener('click', function () {
    var n = CP.cur(); if (!n) return; n.pages += 1; CP.queueSave(n); E.layout();
    var sc = $('#scroller'); sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' });
  });
  CP.$$('.tool[data-tool]').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.getAttribute('data-tool');
      if (S.tool === t) { if (t !== 'select') togglePop($('#popPen'), syncPop); }
      else { S.tool = t; closePops(); syncDock(); CP.persistMeta(); }
    });
  });
  $('#rngW').addEventListener('input', function (e) {
    var v = +e.target.value; if (S.tool === 'text') S.pen.w = v; else cfg().w = v;
    syncPop(); CP.persistMeta();
  });
  $('#btnPaper').addEventListener('click', function () { togglePop($('#popPaper'), renderPaperPop); });
  $('#swPenOnly').addEventListener('click', function () { S.penOnly = !S.penOnly; syncSwitch(); CP.persistMeta(); });
  $('#swSnap').addEventListener('click', function () { S.snap = !S.snap; syncSwitch(); CP.persistMeta(); });
  $('#curCol').addEventListener('click', function () { togglePop($('#popPen'), syncPop); });
  $('#btnInsert').addEventListener('click', function () { togglePop($('#popInsert'), renderInsertPop); });
  CP.$$('[data-ins]').forEach(function (b) { b.addEventListener('click', function () { insKind = b.getAttribute('data-ins'); renderInsert(); }); });
  $('#btnExport').addEventListener('click', function () { closePops(); if (CP.exportPng) CP.exportPng(); });
  $('#scroller').addEventListener('pointerdown', function (e) { if (openPop && !e.target.closest('.pop')) closePops(); });
  window.addEventListener('pagehide', function () { var n = CP.cur(); if (n) CP.flushSave(n); });
  document.addEventListener('visibilitychange', function () { if (document.hidden) { var n = CP.cur(); if (n) CP.flushSave(n); } });
  window.matchMedia('(max-width: 820px)').addEventListener('change', function () { UI.setView(CP.cur() && UI.isNarrow() ? 'editor' : 'list'); setTimeout(E.layout, 50); });
}

/* ---------- Início ---------- */
function boot() {
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  CP.paintIcons(document);
  E.init(); E.initInput(); E.initObjs(); wire();
  var p = CP.initStore();
  applyTheme(); syncDock(); UI.renderAll();
  if (!UI.isNarrow() && window.innerWidth >= 1280) { var first = UI.visible()[0]; if (first) UI.open(first.id); }
  else UI.setView('list');
  p.then(function () {
    applyTheme(); syncDock(); E.resetHistory();
    var open = CP.cur();
    if (S.openId && !open) { S.openId = null; showEditor(false); }
    UI.renderAll();
    if (open) { $('#title').value = open.title || ''; E.layout(); syncTop(); }
    else if (!UI.isNarrow() && window.innerWidth >= 1280) { var f = UI.visible()[0]; if (f) UI.open(f.id); }
  });
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
